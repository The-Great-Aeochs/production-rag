# Optional local S3-compatible server. Select a maintained, verified image.
# No default: the historical MinIO community distribution is archived.
services:
  object-store:
    image: ${OBJECT_STORE_IMAGE:?Set OBJECT_STORE_IMAGE to a verified image digest}
    command: ${OBJECT_STORE_COMMAND:-server /data --console-address :9001}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_data:/data
    restart: unless-stopped
volumes:
  object_data:
