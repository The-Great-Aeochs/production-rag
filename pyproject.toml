[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG system for technical documentation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.9",
    "minio>=7.2",
    "redis>=5.0",
    "sentence-transformers>=2.6",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "services*", "scripts*"]
