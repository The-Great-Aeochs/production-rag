[project]
name = "production-rag"
version = "0.3.0"
description = "Production-grade RAG system for technical documentation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "qdrant-client>=1.9",
    "minio>=7.2",
    "redis>=5.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "anthropic>=0.69",
]

[project.optional-dependencies]
models = ["sentence-transformers>=2.6,<6"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "fakeredis[lua]>=2.26,<3", "mypy>=1.15,<2", "types-redis>=4.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Postgres, Redis, Qdrant, and MinIO"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["CLAUDE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
files = ["shared/config.py", "shared/security.py", "services/query/cache.py", "services/ingestion/jobs.py"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "services*", "scripts*", "prompts*", "migrations*"]

[tool.setuptools.package-data]
prompts = ["*.txt"]
migrations = ["*.sql"]
"services.ingestion" = ["*.sql"]
"services.eval" = ["test_sets/*.json", "fixtures/corpus/*.md"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
